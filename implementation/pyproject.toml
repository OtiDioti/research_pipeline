[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "theoretical-research-pipeline"
version = "0.1.0"
description = "Worktree-local foundation for a future research workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["research_pipeline", "research_pipeline.*"]
namespaces = false
