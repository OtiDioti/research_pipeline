[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "research-pipeline"
version = "0.5.0"
description = "Autonomous research investigations led by a primary agent, with subagents and a final reviewer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["agent-toolkit[console,web]"]

[project.scripts]
research-pipeline = "research_pipeline.cli:main"

[tool.uv.sources]
agent-toolkit = { git = "ssh://git@github.com/OtiDioti/agent_toolkit.git", tag = "v0.5.0" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_pipeline = ["prompts/*.md"]
