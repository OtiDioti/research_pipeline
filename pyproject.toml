[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "research-pipeline"
version = "0.4.0"
description = "Autonomous research investigations led by a primary agent, with subagents and a final reviewer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["agent-toolkit[console,web]"]

[project.scripts]
research-pipeline = "research_pipeline.cli:main"

[tool.uv.sources]
# While unreleased: the local mcp-decisions branch of agent_toolkit (restore the tag pin on release).
agent-toolkit = { path = "../agent_toolkit", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_pipeline = ["prompts/*.md"]
