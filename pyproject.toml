[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "research-pipeline"
version = "0.2.0"
description = "Autonomous research investigations led by a primary agent, with subagents and a final reviewer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["agent-sessions[console]", "mcp>=1.26,<2"]

[project.scripts]
research-pipeline = "research_pipeline.cli:main"

[tool.uv.sources]
agent-sessions = { git = "ssh://git@github.com/OtiDioti/agent_sessions.git", branch = "shared-machinery" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_pipeline = ["prompts/*.md"]
